plugins {
	id 'java'
	id 'org.springframework.boot' version '3.4.13'  // было 3.2.1
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'ru.vkr'
version = '0.0.1-SNAPSHOT'
description = 'blockchain'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// Spring Boot стартеры
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'

	// PostgreSQL для метаданных (User, Authority, AuditLog)
	runtimeOnly 'org.postgresql:postgresql'

	// Liquibase для миграций БД
	implementation 'org.liquibase:liquibase-core'

	// Jackson для JSR310
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	// Bouncy Castle для криптографии (ECDSA, SHA-256, AES)
	implementation 'org.bouncycastle:bcprov-jdk18on:1.78.1'
	implementation 'org.bouncycastle:bcpkix-jdk18on:1.79'

	// LevelDB для блоков и транзакций
	implementation 'org.iq80.leveldb:leveldb:0.12'
	implementation 'org.iq80.leveldb:leveldb-api:0.12'
	implementation 'com.google.guava:guava:33.0.0-jre'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// Swagger/OpenAPI
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.6.0'

	// Тестирование
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'

	implementation 'commons-codec:commons-codec:1.16.0'

}

tasks.named('test') {
	useJUnitPlatform()
}
