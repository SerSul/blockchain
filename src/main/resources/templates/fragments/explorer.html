<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:fragment="head (title)">
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1"/>
    <title th:text="${title} + ' — Blockchain Explorer'">Blockchain Explorer</title>
    <style>
        :root {
            --bg: #0f1419;
            --surface: #1a2332;
            --border: #2d3a4d;
            --text: #e7ecf3;
            --muted: #8b9cb3;
            --accent: #3d8bfd;
            --mono: ui-monospace, "Cascadia Code", Consolas, monospace;
        }
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: system-ui, -apple-system, Segoe UI, Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            line-height: 1.5;
            min-height: 100vh;
        }
        .nav {
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            padding: 0.75rem 1.5rem;
            display: flex;
            align-items: center;
            gap: 1.5rem;
        }
        .nav a {
            color: var(--accent);
            text-decoration: none;
            font-weight: 600;
        }
        .nav a:hover { text-decoration: underline; }
        .nav span { color: var(--muted); font-size: 0.9rem; }
        main { max-width: 1200px; margin: 0 auto; padding: 1.5rem; }
        h1 { font-size: 1.5rem; margin: 0 0 1rem; font-weight: 600; }
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 1rem 1.25rem;
            margin-bottom: 1rem;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.875rem;
        }
        th, td {
            text-align: left;
            padding: 0.6rem 0.75rem;
            border-bottom: 1px solid var(--border);
        }
        th { color: var(--muted); font-weight: 500; }
        tr:hover td { background: rgba(61, 139, 253, 0.06); }
        .mono { font-family: var(--mono); font-size: 0.8rem; word-break: break-all; }
        .hash-link { color: var(--accent); text-decoration: none; }
        .hash-link:hover { text-decoration: underline; }
        .muted { color: var(--muted); }
        .filters { display: flex; flex-wrap: wrap; gap: 0.75rem; align-items: flex-end; margin-bottom: 1rem; }
        .filters label { display: flex; flex-direction: column; gap: 0.25rem; font-size: 0.8rem; color: var(--muted); }
        .filters input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 0.4rem 0.6rem; border-radius: 4px; }
        .btn {
            background: var(--accent);
            color: #fff;
            border: none;
            padding: 0.45rem 1rem;
            border-radius: 4px;
            cursor: pointer;
            font-weight: 500;
        }
        .btn:hover { filter: brightness(1.1); }
        .pagination { display: flex; gap: 0.5rem; align-items: center; margin-top: 1rem; flex-wrap: wrap; }
        .pagination a, .pagination span { padding: 0.35rem 0.65rem; border-radius: 4px; }
        .pagination a { background: var(--surface); border: 1px solid var(--border); color: var(--accent); text-decoration: none; }
        .pagination a:hover { border-color: var(--accent); }
        .pagination .disabled { color: var(--muted); pointer-events: none; opacity: 0.5; }
        dl.grid { display: grid; grid-template-columns: 140px 1fr; gap: 0.5rem 1rem; margin: 0; }
        dl.grid dt { color: var(--muted); margin: 0; }
        dl.grid dd { margin: 0; font-family: var(--mono); font-size: 0.82rem; word-break: break-all; }
        .badge { display: inline-block; padding: 0.15rem 0.5rem; border-radius: 4px; font-size: 0.75rem; background: var(--border); }
        .empty { color: var(--muted); padding: 2rem; text-align: center; }
        .back { margin-bottom: 1rem; }
        .back a { color: var(--accent); }
    </style>
</head>
<body>
<nav th:fragment="nav" class="nav">
    <a th:href="@{/explorer/blocks}">Блоки</a>
    <span class="muted">|</span>
    <a th:href="@{/explorer/pending}">Pending</a>
    <span class="muted">|</span>
    <span>Локальный обозреватель цепочки</span>
</nav>
</body>
</html>
