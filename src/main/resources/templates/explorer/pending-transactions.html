<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="ru">
<head th:replace="~{fragments/explorer :: head ('Ожидающие транзакции')}">
    <title>Pending</title>
</head>
<body>
<div th:replace="~{fragments/explorer :: nav}"></div>
<main>
    <h1>Ожидающие транзакции (pending)</h1>
    <p class="muted" style="margin: -0.5rem 0 1rem;">Транзакции в пуле до включения в блок.</p>

    <form class="card filters" method="get" th:action="@{/explorer/pending}">
        <label>На странице
            <input type="number" name="size" th:value="${size}" min="5" max="100"/>
        </label>
        <input type="hidden" name="page" value="0"/>
        <button type="submit" class="btn">Применить</button>
    </form>

    <div class="card" th:if="${page != null && !page.content.isEmpty()}">
        <table>
            <thead>
            <tr>
                <th>ID</th>
                <th>Тип</th>
                <th>Отправитель</th>
                <th>Статус</th>
                <th>Content-Type</th>
                <th>Размер</th>
                <th>Время</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="tx : ${page.content}">
                <td class="mono">
                    <a class="hash-link" th:href="@{/explorer/transactions/{id}(id=${tx.id})}"
                       th:text="${#strings.substring(tx.id,0,8)} + '…'">abc…</a>
                </td>
                <td th:text="${tx.transactionType}">—</td>
                <td class="mono muted" th:text="${#strings.substring(tx.senderId,0,14)} + '…'">0x…</td>
                <td><span class="badge" th:text="${tx.status}">PENDING</span></td>
                <td class="muted" th:text="${tx.contentType != null ? tx.contentType : '—'}">—</td>
                <td th:text="${tx.contentSize != null ? tx.contentSize : '—'}">—</td>
                <td th:text="${tx.timestamp != null ? #temporals.format(tx.timestamp, 'yyyy-MM-dd HH:mm:ss') : '—'}">—</td>
            </tr>
            </tbody>
        </table>

        <div class="pagination" th:if="${page.totalPages > 1}">
            <a th:if="${page.number > 0}"
               th:href="@{/explorer/pending(page=${page.number - 1}, size=${size})}">← Назад</a>
            <span th:if="${page.number == 0}" class="disabled">← Назад</span>
            <span class="muted">Страница <span th:text="${page.number + 1}">1</span> из <span th:text="${page.totalPages}">1</span>
                (<span th:text="${page.totalElements}">0</span> шт.)</span>
            <a th:if="${!page.last}"
               th:href="@{/explorer/pending(page=${page.number + 1}, size=${size})}">Вперёд →</a>
            <span th:if="${page.last}" class="disabled">Вперёд →</span>
        </div>
    </div>

    <div class="card empty" th:if="${page == null || page.content.isEmpty()}">
        Нет ожидающих транзакций. Добавьте их через API (например <span class="mono">POST /api/transactions/store</span>).
    </div>
</main>
</body>
</html>
