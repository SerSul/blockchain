databaseChangeLog:
  - changeSet:
      id: 001-create-users-table
      author: dmitri
      changes:
        - createTable:
            tableName: users
            columns:
              - column:
                  name: address
                  type: VARCHAR(66)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: username
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
                    unique: true
              - column:
                  name: public_key
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: private_key_encrypted
                  type: TEXT
                  constraints:
                    nullable: false
              - column:
                  name: user_role
                  type: VARCHAR(20)
                  constraints:
                    nullable: false
              - column:
                  name: is_active
                  type: BOOLEAN
                  defaultValueBoolean: true
                  constraints:
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_username
            tableName: users
            columns:
              - column:
                  name: username
