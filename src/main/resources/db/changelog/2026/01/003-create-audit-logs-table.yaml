databaseChangeLog:
  - changeSet:
      id: 003-create-audit-logs-table
      author: dmitri
      changes:
        - createTable:
            tableName: audit_logs
            columns:
              - column:
                  name: id
                  type: VARCHAR(36)
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: entity_type
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: entity_id
                  type: VARCHAR(100)
                  constraints:
                    nullable: false
              - column:
                  name: action
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: actor_address
                  type: VARCHAR(66)
                  constraints:
                    nullable: false
              - column:
                  name: details
                  type: TEXT
              - column:
                  name: timestamp
                  type: TIMESTAMP
                  constraints:
                    nullable: false

        - createIndex:
            indexName: idx_entity
            tableName: audit_logs
            columns:
              - column:
                  name: entity_type
              - column:
                  name: entity_id

        - createIndex:
            indexName: idx_timestamp
            tableName: audit_logs
            columns:
              - column:
                  name: timestamp

        - createIndex:
            indexName: idx_actor
            tableName: audit_logs
            columns:
              - column:
                  name: actor_address
