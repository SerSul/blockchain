services:
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_API_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 20

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "${DB_HOST_PORT}:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 20

  node:
    build:
      context: .
      dockerfile: Dockerfile
    depends_on:
      minio:
        condition: service_healthy
      postgres:
        condition: service_healthy
    environment:
      SERVER_PORT: ${APP_PORT}
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${DB_NAME}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      LEVELDB_PATH: ${LEVELDB_PATH}
      BLOCKCHAIN_BOOTSTRAP_VALIDATOR_PUBLIC_KEYS_0: ${BLOCKCHAIN_BOOTSTRAP_VALIDATOR_PUBLIC_KEYS_0:-}
      BLOCKCHAIN_BOOTSTRAP_VALIDATOR_PUBLIC_KEYS_1: ${BLOCKCHAIN_BOOTSTRAP_VALIDATOR_PUBLIC_KEYS_1:-}
      BLOCKCHAIN_BOOTSTRAP_PEERS_0: ${BLOCKCHAIN_BOOTSTRAP_PEERS_0:-}
      BLOCKCHAIN_BOOTSTRAP_SYNC_ENABLED: ${BLOCKCHAIN_BOOTSTRAP_SYNC_ENABLED:-false}
      BLOCKCHAIN_SYNC_INTERVAL_MS: ${BLOCKCHAIN_SYNC_INTERVAL_MS:-15000}
      BLOCKCHAIN_BOOTSTRAP_SYNC_BATCH_SIZE: ${BLOCKCHAIN_BOOTSTRAP_SYNC_BATCH_SIZE:-50}
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY}
      MINIO_BUCKET: ${MINIO_BUCKET}
    ports:
      - "${APP_PORT}:${APP_PORT}"
    volumes:
      - leveldb_data:/data/leveldb

volumes:
  minio_data:
  pg_data:
  leveldb_data:
