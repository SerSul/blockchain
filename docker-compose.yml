# PostgreSQL под настройки из src/main/resources/application.yml
services:
  postgres:
    image: postgres:16-alpine
    container_name: blockchain-postgres
    environment:
      POSTGRES_DB: blockchain_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123"
    ports:
      - "5432:5432"
    volumes:
      - blockchain_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d blockchain_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  blockchain_pg_data:
